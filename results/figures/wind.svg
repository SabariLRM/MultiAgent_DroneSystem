<text class="title" x="16" y="26">Continuous flight in wind (reservations + ORCA, 12 drones)</text>
<text class="sub" x="16" y="45">Headwinds cost energy and the airspeed limit slows drones; the energy check keeps every drone safe by refusing what it cannot price within its battery.</text>
